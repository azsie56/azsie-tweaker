name: Add release SHA256

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --dir release-assets
      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS.txt
      - name: Upload checksum asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" release-assets/SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
